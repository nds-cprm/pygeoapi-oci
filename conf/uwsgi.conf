[uwsgi]
# options set in this file win over UWSGI_<OPTION> environment variables, except
# processes and threads below; to change any other, append it to the CMD
# (uwsgi --ini /var/lib/uwsgi/uwsgi.conf --harakiri 120)
strict = true
master = true
need-app = true
module = pygeoapi.flask_app:APP

# uwsgi protocol, not HTTP: meant to sit behind nginx (uwsgi_pass), see
# examples/; for plain HTTP, override this file with http-socket instead, and
# the /usr/local/bin/healthcheck too. The port is PYGEOAPI_LISTEN_PORT (8000
# by default, set in the image), also read by the healthcheck
socket = :$(PYGEOAPI_LISTEN_PORT)

# defaults, used only when UWSGI_PROCESSES / UWSGI_THREADS are not set
if-not-env = UWSGI_PROCESSES
processes = 4
endif =
if-not-env = UWSGI_THREADS
threads = 2
endif =
enable-threads = true
single-interpreter = true

# uWSGI 2.0 reloads on SIGTERM: stop instead, as docker/podman/kubernetes expect
die-on-term = true

# long query strings (CQL filters, bbox, properties) exceed the 4 KiB default
buffer-size = 32768
# kill a worker stuck on a request for longer than this (seconds); request
# bodies are buffered first, so a slow upload does not count against it. Keep
# the uwsgi_read_timeout of nginx a bit longer (65s in examples/)
harakiri = 60
post-buffering = 8192

# no per-request lines: pygeoapi does its own logging
disable-logging = true
log-4xx = true
log-5xx = true
