# PYGEOAPI_PORT of the pygeoapi container (8000 by default)
upstream pygeoapi {
    server pygeoapi:8000;
}

server {
    listen 8080;

    # don't expose the nginx version in headers and error pages
    server_tokens off;

    # JSON, HTML, OpenAPI and schemas compress well. nginx matches the whole
    # Content-Type except a charset, so the OpenAPI type with its version
    # parameter needs an entry of its own
    gzip on;
    gzip_types application/json application/geo+json application/schema+json
               application/vnd.oai.openapi+json "application/vnd.oai.openapi+json;version=3.0"
               application/ld+json application/yaml
               text/css application/javascript text/plain;
    gzip_min_length 1024;

    include uwsgi_params;

    # keep in sync with uWSGI's harakiri (60 s, conf/uwsgi.conf of the image)
    uwsgi_read_timeout 65s;

    # hold whole responses (e.g. large GeoJSON pages) in memory, so the uWSGI
    # worker is released as soon as possible
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 64k;

    location / {
        uwsgi_pass pygeoapi;
    }
}
