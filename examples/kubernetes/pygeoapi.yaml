# pygeoapi behind nginx (nginx.yaml), with a read-only root filesystem: the
# only writable paths are two emptyDir volumes, /tmp (nss_wrapper passwd entry
# for the UID) and /var/lib/pygeoapi (the OpenAPI document, generated on every
# start). No runAsUser: the image runs as 1000:0, and OpenShift's restricted-v2
# SCC replaces the UID with an arbitrary one, which the image also supports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pygeoapi
  labels:
    app.kubernetes.io/name: pygeoapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pygeoapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pygeoapi
    spec:
      # no <SERVICE>_PORT, <SERVICE>_SERVICE_HOST... variables for every Service
      # of the namespace: they would leak into the environment of pygeoapi
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pygeoapi
          image: docker.io/ndscprm/pygeoapi:0.24.0
          ports:
            # uwsgi protocol, not HTTP (PYGEOAPI_LISTEN_PORT)
            - name: uwsgi
              containerPort: 8000
          env:
            # public URL, base of every link pygeoapi generates: the address
            # clients use (Ingress/Route), with the subpath, if any
            - name: PYGEOAPI_SERVER_URL
              value: http://localhost:8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: openapi
              mountPath: /var/lib/pygeoapi
            # your own configuration (collections), replacing the default one:
            # - name: config
            #   mountPath: /etc/pygeoapi/config.yml
            #   subPath: config.yml
            #   readOnly: true
          # Kubernetes ignores the image HEALTHCHECK: the probes call the same
          # script, a uWSGI ping answered by a worker. The startup probe allows
          # 60 s for the OpenAPI generation and the first worker
          startupProbe:
            exec:
              command: [healthcheck]
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [healthcheck]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openapi
          emptyDir:
            sizeLimit: 16Mi
        # - name: config
        #   configMap:
        #     name: pygeoapi-config
---
# the name is the upstream host in nginx.conf (pygeoapi:8000)
apiVersion: v1
kind: Service
metadata:
  name: pygeoapi
  labels:
    app.kubernetes.io/name: pygeoapi
spec:
  selector:
    app.kubernetes.io/name: pygeoapi
  ports:
    - name: uwsgi
      port: 8000
      targetPort: uwsgi
