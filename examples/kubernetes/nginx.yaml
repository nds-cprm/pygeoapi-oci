# nginx in front of pygeoapi: HTTP on 8080, uwsgi_pass to the pygeoapi Service.
# Its configuration is the ConfigMap nginx-conf, created from the same file as
# the Compose example (see README.md):
#   kubectl create configmap nginx-conf \
#     --from-file=default.conf=examples/nginx/conf/nginx/nginx.conf
# Unprivileged image with a read-only root filesystem: nginx writes only to
# /tmp (pid file and temporary files), an emptyDir. It also runs with the
# arbitrary UIDs of OpenShift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      # no <SERVICE>_PORT, <SERVICE>_SERVICE_HOST... variables for every Service
      # of the namespace (nginx finds pygeoapi by DNS)
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 8080
      targetPort: http
