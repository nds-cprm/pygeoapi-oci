# Keeps the locks (requirements/pygeoapi/ and requirements/extra/, one pair per
# pygeoapi version) in sync and proposes the changes as a pull request; the
# image build never resolves dependencies, it only reads the locks.
#
# Runs on pushes to main that touch the Dockerfile:
#   - GDAL_VERSION, PYTHON_VERSION or BASE_DATE changed (new base image):
#     regenerates every lock, since they are resolved against the packages the
#     base image ships
#   - the latest pygeoapi on PyPI has no lock yet: generates it and makes it the
#     default PYGEOAPI_VERSION
#
# Requires "Allow GitHub Actions to create and approve pull requests" in the
# repository (or organization) settings, under Actions > General.
name: Update locks

on:
  push:
    branches: [main]
    paths: [Dockerfile]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-locks
  cancel-in-progress: false

jobs:
  update-locks:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Regenerate every lock if the base image changed
        run: |
          base_args() {
              grep -E '^ARG (GDAL_VERSION|PYTHON_VERSION|BASE_DATE)=' "$@"
          }
          # first push of the branch: nothing to compare against
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ] ||
              ! git cat-file -e "$BEFORE:Dockerfile" 2>/dev/null; then
              echo "no previous Dockerfile to compare: regenerating every lock"
              changed=yes
          elif [ "$(git show "$BEFORE:Dockerfile" | base_args)" != "$(base_args Dockerfile)" ]; then
              echo "base image changed:"
              git show "$BEFORE:Dockerfile" | base_args | sed 's/^/  before: /'
              base_args Dockerfile | sed 's/^/  now:    /'
              changed=yes
          fi
          if [ "${changed:-}" = yes ]; then
              requirements/update-requirements.sh requirements/pygeoapi/*
              echo "BASE_CHANGED=yes" >> "$GITHUB_ENV"
          fi

      - name: Lock the latest pygeoapi and make it the default
        run: |
          latest=$(curl -fsS https://pypi.org/pypi/pygeoapi/json | jq -r .info.version)
          current=$(sed -n 's/^ARG PYGEOAPI_VERSION=//p' Dockerfile)
          echo "latest pygeoapi: $latest, default: $current"
          if [ ! -f "requirements/pygeoapi/$latest.txt" ]; then
              requirements/update-requirements.sh "$latest"
              sed -i "s/^ARG PYGEOAPI_VERSION=.*/ARG PYGEOAPI_VERSION=$latest/" Dockerfile
              echo "NEW_PYGEOAPI=$latest" >> "$GITHUB_ENV"
          fi

      - name: Open a pull request with the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "locks are up to date"
              exit 0
          fi

          title="Update locks"
          body="Generated by the \`${GITHUB_WORKFLOW}\` workflow from ${GITHUB_SHA}."
          if [ -n "${NEW_PYGEOAPI:-}" ]; then
              title="pygeoapi ${NEW_PYGEOAPI}"
              body="${body}

          - Adds \`requirements/pygeoapi/${NEW_PYGEOAPI}.txt\` and \`requirements/extra/${NEW_PYGEOAPI}.txt\` and makes ${NEW_PYGEOAPI} the default \`PYGEOAPI_VERSION\`."
          fi
          if [ -n "${BASE_CHANGED:-}" ]; then
              [ -n "${NEW_PYGEOAPI:-}" ] && title="${title}, regenerated locks" || title="Regenerate locks for the new base image"
              body="${body}
          - Regenerates every lock in \`requirements/pygeoapi/\` and \`requirements/extra/\` for the new base image."
          fi
          body="${body}

          Build the image before merging: a new lock may bring rasterio, pyproj or shapely versions that need a newer GDAL, PROJ or GEOS than the base image has."

          branch="update-locks/${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add requirements/pygeoapi requirements/extra Dockerfile
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
