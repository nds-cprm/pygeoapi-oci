# Keeps the locks (requirements/pygeoapi/, requirements/extra/ and
# requirements/build-no-binary/, three per pygeoapi version) in sync and
# proposes the changes as a pull request; the image build never resolves
# dependencies, it only reads the locks.
#
# The base image of the locks is the devel image in their header line (... on
# <image>), read from the lock of the default PYGEOAPI_VERSION; the ARG defaults
# of the Dockerfile are moving tags, not the base of the locks.
#
# Runs:
#   - manually, with image_devel (required, the full name of a ndscprm/gdal
#     devel image, ideally the dated tag with its digest): regenerates every lock
#     on it if the locks are on another image, since they are resolved against
#     the packages it ships. This is how the base image of the locks is changed
#   - on pushes to main that touch the Dockerfile: if the GDAL_IMAGE_DEVEL or
#     GDAL_IMAGE_PY default changed (another GDAL or Python), fails, asking for a
#     manual run with the new devel image
#   - both: if the latest pygeoapi on PyPI has no lock yet, generates it on the
#     image of the locks (or the given one) and makes it the default
#     PYGEOAPI_VERSION
#
# Requires "Allow GitHub Actions to create and approve pull requests" in the
# repository (or organization) settings, under Actions > General.
name: Update locks

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:
    inputs:
      image_devel:
        description: ndscprm/gdal devel image to resolve every lock on, e.g. docker.io/ndscprm/gdal:3.12.4-py3.12-devel-20261026@sha256:...
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-locks
  cancel-in-progress: false

jobs:
  update-locks:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_ENGINE: docker
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # LOCK_IMAGE: the input of a manual run, or the devel image the current locks were resolved on
      - name: Regenerate every lock if the base image changed
        env:
          INPUT: ${{ inputs.image_devel }}
        run: |
          version=$(sed -n 's/^ARG PYGEOAPI_VERSION=//p' Dockerfile)
          # image of the current locks, from the header line of the default version
          locked=$(sed -n '2s/.* on \(docker\.io\/ndscprm\/gdal:[^ ]*\)$/\1/p' "requirements/pygeoapi/$version.txt")
          echo "locks of pygeoapi $version resolved on: ${locked:-unknown}"
          if [ -n "$INPUT" ]; then
              case $INPUT in
                  docker.io/ndscprm/gdal:*-devel*) ;;
                  *)
                      echo "::error::not a docker.io/ndscprm/gdal devel image: $INPUT"
                      exit 1
                      ;;
              esac
              image=$INPUT
              if [ "$image" != "$locked" ]; then
                  echo "regenerating every lock on $image"
                  requirements/update-requirements.sh --image "$image" requirements/pygeoapi/*
                  echo "BASE_CHANGED=yes" >> "$GITHUB_ENV"
              else
                  echo "the locks are already on $image"
              fi
          else
              image=$locked
              base_args() { grep -E '^ARG (GDAL_IMAGE_DEVEL|GDAL_IMAGE_PY)=' "$@" || :; }
              # nothing to compare against: first push of the branch, or a Dockerfile from
              # before these ARGs (GDAL_VERSION/PYTHON_VERSION/BASE_DATE)
              previous=
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                  git cat-file -e "$BEFORE:Dockerfile" 2>/dev/null; then
                  previous=$(git show "$BEFORE:Dockerfile" | base_args)
              fi
              if [ -n "$previous" ] && [ "$previous" != "$(base_args Dockerfile)" ]; then
                  echo "base image changed:"
                  git show "$BEFORE:Dockerfile" | base_args | sed 's/^/  before: /'
                  base_args Dockerfile | sed 's/^/  now:    /'
                  echo "::error::the base image defaults changed: run this workflow manually with the new devel image (dated tag and digest) to regenerate the locks"
                  exit 1
              fi
          fi
          echo "LOCK_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Lock the latest pygeoapi and make it the default
        run: |
          latest=$(curl -fsS https://pypi.org/pypi/pygeoapi/json | jq -r .info.version)
          current=$(sed -n 's/^ARG PYGEOAPI_VERSION=//p' Dockerfile)
          echo "latest pygeoapi: $latest, default: $current"
          if [ ! -f "requirements/pygeoapi/$latest.txt" ]; then
              requirements/update-requirements.sh --image "$LOCK_IMAGE" "$latest"
              sed -i "s/^ARG PYGEOAPI_VERSION=.*/ARG PYGEOAPI_VERSION=$latest/" Dockerfile
              echo "NEW_PYGEOAPI=$latest" >> "$GITHUB_ENV"
          fi

      - name: Open a pull request with the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "locks are up to date"
              exit 0
          fi

          title="Update locks"
          body="Generated by the \`${GITHUB_WORKFLOW}\` workflow from ${GITHUB_SHA}."
          if [ -n "${NEW_PYGEOAPI:-}" ]; then
              title="pygeoapi ${NEW_PYGEOAPI}"
              body="${body}

          - Adds the locks of ${NEW_PYGEOAPI} (\`requirements/{pygeoapi,extra,build-no-binary}/${NEW_PYGEOAPI}.txt\`) and makes ${NEW_PYGEOAPI} the default \`PYGEOAPI_VERSION\`."
          fi
          if [ -n "${BASE_CHANGED:-}" ]; then
              [ -n "${NEW_PYGEOAPI:-}" ] && title="${title}, regenerated locks" || title="Regenerate locks for the new base image"
              body="${body}
          - Regenerates every lock in \`requirements/pygeoapi/\`, \`requirements/extra/\` and \`requirements/build-no-binary/\` on \`${LOCK_IMAGE}\`."
          fi
          body="${body}

          Build the image before merging: a new lock may bring rasterio, pyproj or shapely versions that need a newer GDAL, PROJ or GEOS than the base image has."

          branch="update-locks/${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add requirements/pygeoapi requirements/extra requirements/build-no-binary Dockerfile
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
