# Builds, tests, scans and publishes ndscprm/pygeoapi with the reusable workflow of the base image
# (README of gdal-oci, "Workflow reutilizável"): native runners per architecture (amd64 and arm64, so
# rasterio, pyproj and shapely are compiled without emulation), push by digest, tags only after the tests
# and scans of both architectures.
name: Docker Image CI

on:
  # manual, and also dispatched by the CI of gdal-oci after it publishes new ndscprm/gdal images, with their
  # full names. There is no scheduled rebuild: a new base image invalidates every layer, so every build
  # started by gdal-oci is a full one
  workflow_dispatch:
    # full names of the ndscprm/gdal images to build on (the CI of gdal-oci sends the dated tags it has just
    # published, pinned by digest: <tag>-<YYYYMMDD>@sha256:...). Every derived image declares the same
    # three inputs, so gdal-oci sends the same set to all of them; this one uses devel and py (image_nopy
    # is accepted and ignored). Empty = the ARG default of the Dockerfile (a moving tag)
    inputs:
      image_devel:
        description: ndscprm/gdal devel image (GDAL_IMAGE_DEVEL). Empty = Dockerfile default
        required: false
        default: ""
      image_py:
        description: ndscprm/gdal image with Python (GDAL_IMAGE_PY). Empty = Dockerfile default
        required: false
        default: ""
      image_nopy:
        description: ndscprm/gdal image without Python. Not used here
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # the inputs must name ndscprm/gdal images (a manual run could otherwise build on any image), and only
  # Python 3.12 images are built: the locks hash only cp312 wheels, and every build publishes the same
  # <PYGEOAPI_VERSION> tag. A dispatch with images of another Python is skipped (build=false)
  check:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          IMAGES: ${{ inputs.image_devel }} ${{ inputs.image_py }}
          # keep in sync with the Python of the ARG defaults in the Dockerfile
          PYTHON: py3.12
        run: |
          build=true
          for image in $IMAGES; do
              case $image in
                  docker.io/ndscprm/gdal:*) echo "base image: $image" ;;
                  *)
                      echo "::error::not a docker.io/ndscprm/gdal image: $image"
                      exit 1
                      ;;
              esac
              # the tag carries the Python: <gdal>-py3.12[-devel][-<date>][@sha256:...]
              if ! echo "${image#*:}" | grep -Eq -- "-${PYTHON//./\\.}(\$|[-@])"; then
                  echo "::notice::not a ${PYTHON} image, skipped: $image"
                  build=false
              fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    # one publishing build at a time (never cancelled). On the job, not the workflow, so that a dispatch
    # skipped by the if above never joins the group: a group keeps one pending run, and a newer one cancels it
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    uses: nds-cprm/gdal-oci/.github/workflows/oci-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/pygeoapi
      # the version of the build is the default of ARG PYGEOAPI_VERSION (lock in requirements/pygeoapi/)
      version-arg: PYGEOAPI_VERSION
      # base images given by gdal-oci when it starts this workflow (the images it has just published);
      # empty lines are ignored, so without them the ARG defaults of the Dockerfile are built
      build-args: |
        ${{ inputs.image_devel && format('GDAL_IMAGE_DEVEL={0}', inputs.image_devel) || '' }}
        ${{ inputs.image_py && format('GDAL_IMAGE_PY={0}', inputs.image_py) || '' }}
      labels: |
        org.opencontainers.image.title=pygeoapi
        org.opencontainers.image.description=Implementação OCI de pygeoapi
        org.opencontainers.image.version={version}
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.url=https://github.com/nds-cprm/pygeoapi-oci
      # the final stage has no name: no target, Bake builds the last stage
      variants: |
        [
          {"name": "release", "tag": "{version}", "scan": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
