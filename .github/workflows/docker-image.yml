# Builds, tests, scans and publishes ndscprm/pygeoapi with the reusable workflow of the base image
# (README of gdal-oci, "Workflow reutilizável"): native runners per architecture (amd64 and arm64, so
# rasterio, pyproj and shapely are compiled without emulation), push by digest, tags only after the tests
# and scans of both architectures. Pull requests are only built and tested (no push, no secrets).
name: Docker Image CI

on:
  # manual, and also dispatched by the CI of gdal-oci after it publishes new ndscprm/gdal tags, with their
  # versions in gdal_version and python_version (pull requests build the ARG defaults of the Dockerfile).
  # The base is pinned by its dated tag (ARG BASE_DATE): without base_date, a dispatch builds the date in
  # the Dockerfile, not the tags gdal-oci has just published.
  # There is no scheduled rebuild: a new base image invalidates every layer, so every build started by
  # gdal-oci is a full one
  workflow_dispatch:
    inputs:
      gdal_version:
        description: ndscprm/gdal GDAL version (base image tags). Empty = ARG GDAL_VERSION in the Dockerfile
        required: false
        default: ""
      python_version:
        description: ndscprm/gdal Python version (base image tags). Empty = ARG PYTHON_VERSION in the Dockerfile
        required: false
        default: ""
      base_date:
        description: ndscprm/gdal dated tag suffix (YYYYMMDD or YYYYMMDD.N). Empty = ARG BASE_DATE in the Dockerfile
        required: false
        default: ""
  pull_request:
    branches: [main]

permissions:
  contents: read

# one publishing build at a time (never cancelled); a new commit cancels the build of the previous one in
# the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: nds-cprm/gdal-oci/.github/workflows/oci-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/pygeoapi
      # the version of the build is the default of ARG PYGEOAPI_VERSION (lock in requirements/pygeoapi/)
      version-arg: PYGEOAPI_VERSION
      push: ${{ github.event_name != 'pull_request' }}
      # base image versions given by gdal-oci when it starts this workflow (the tags it has just published);
      # empty lines are ignored, so without them the ARG defaults of the Dockerfile are built
      build-args: |
        ${{ inputs.gdal_version && format('GDAL_VERSION={0}', inputs.gdal_version) || '' }}
        ${{ inputs.python_version && format('PYTHON_VERSION={0}', inputs.python_version) || '' }}
        ${{ inputs.base_date && format('BASE_DATE={0}', inputs.base_date) || '' }}
      labels: |
        org.opencontainers.image.title=pygeoapi
        org.opencontainers.image.description=Implementação OCI de pygeoapi
        org.opencontainers.image.version={version}
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.url=https://github.com/nds-cprm/pygeoapi-oci
      # the final stage has no name: no target, Bake builds the last stage
      variants: |
        [
          {"name": "release", "tag": "{version}", "scan": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
